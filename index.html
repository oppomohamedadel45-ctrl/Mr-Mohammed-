<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مستر محمد عادل التعليمية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #1a365d;
            color: white;
            padding: 2rem 1rem;
        }
        h1 { margin: 0; font-size: 2.2rem; }
        p { font-size: 1.1rem; color: #e2e8f0; }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #2b6cb0;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
        }
        .btn:hover { background-color: #2c5282; }
    </style>
</head>
<body>

    <header>
        <h1>منصة مستر محمد عادل التعليمية</h1>
        <p>أهلاً بكم في المنصة الخاصة بالشرح والمراجعات والمواد التعليمية</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>مرحباً بكم يا شباب!</h2>
            <p>سيتم رفع المحاضرات، الجداول، وملخصات الدروس هنا بشكل دوري.</p>
            <a href="#" class="btn">تصفح الدروس</a>
        </div>
    </div>

</body>
</html>
