<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0915;
            --bg-surface: rgba(18, 16, 38, 0.95);
            --bg-card: rgba(27, 24, 56, 0.95);
            --border-glow: rgba(138, 43, 226, 0.4);
            --accent-purple: #8a2be2;
            --accent-blue: #00d2ff;
            --text-main: #f0f2f8;
            --text-sub: #a0a5c0;
            --user-msg-bg: linear-gradient(135deg, rgba(138, 43, 226, 0.5), rgba(75, 0, 130, 0.6));
            --ai-msg-bg: rgba(20, 24, 45, 0.95);
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        html, body {
            width: 100%; height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #lock-screen {
            position: fixed; inset: 0; background: rgba(10, 9, 21, 0.98);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #lock-screen.hidden { display: none; }
        .lock-box {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            padding: 2.5rem; border-radius: 24px; text-align: center; width: 90%; max-width: 400px;
        }
        .pin-input {
            width: 100%; padding: 12px; font-size: 1.5rem; letter-spacing: 12px; text-align: center;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; margin-bottom: 1rem; outline: none;
        }
        .lock-btn {
            width: 100%; padding: 12px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue)); color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer;
        }

        .app-container { display: flex; width: 100%; height: 100%; overflow: hidden; position: relative; }

        .sidebar {
            width: 280px; background: var(--bg-surface); border-left: 1px solid var(--border-glow);
            display: flex; flex-direction: column; padding: 1rem; height: 100%; flex-shrink: 0; z-index: 10;
        }
        .new-chat-btn {
            background: rgba(138,43,226,0.3); border: 1px solid var(--border-glow); color: white;
            padding: 12px; border-radius: 14px; cursor: pointer; margin-bottom: 1rem; font-weight: 600;
        }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item {
            padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03); cursor: pointer;
            font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-sub);
        }
        .history-item.active { background: rgba(138,43,226,0.3); color: #fff; }

        .main-content {
            flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; background: rgba(10,9,21,0.4); overflow: hidden;
        }

        header {
            height: 60px; padding: 0 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center; background: rgba(15,13,33,0.9); flex-shrink: 0;
        }
        .chat-title { font-size: 1.1rem; font-weight: 700; }
        .header-actions { display: flex; gap: 10px; }
        .icon-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; }

        /* شريط الكتابة والكيبورد في الأعلى تحت الهيدر مباشرة */
        .input-area {
            width: 100%;
            padding: 12px 1.5rem; background: rgba(15, 13, 33, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.15); display: flex; gap: 10px; align-items: center; flex-shrink: 0; z-index: 20;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .input-box-wrapper { flex: 1; display: flex; align-items: center; }
        textarea {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; padding: 10px 14px; color: #fff; resize: none; height: 45px; outline: none; font-size: 0.95rem;
        }
        .send-btn, .mic-btn {
            width: 45px; height: 45px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue)); color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; flex-shrink: 0;
        }
        .mic-btn { background: rgba(255,255,255,0.1); }

        .chat-box {
            flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth;
        }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; user-select: text; word-break: break-word; position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
        }
        .message.user { align-self: flex-start; background: var(--user-msg-bg); color: #fff; }
        .message.ai { align-self: flex-end; background: var(--ai-msg-bg); border: 1px solid rgba(0,210,255,0.2); }
        .message.error-msg { background: rgba(255, 71, 87, 0.2); border: 1px solid var(--danger); color: #ff6b81; align-self: center; max-width: 90%; }
        
        .delete-msg-btn {
            background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 0.9rem; padding: 0 4px;
        }
        .delete-msg-btn:hover { color: var(--danger); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); padding: 1.8rem; border-radius: 20px; width: 90%; max-width: 450px; border: 1px solid var(--border-glow); }
        .modal-input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 10px; color: #fff; margin-bottom: 1rem; outline: none;
        }
        textarea.modal-input { resize: vertical; height: 80px; }
        .save-btn {
            width: 100%; background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            border: none; color: white; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h2 style="color:#00d2ff; margin-bottom:0.5rem;">نظام الأمان</h2>
            <p style="color:var(--text-sub); margin-bottom:1.5rem;">أدخل رمز PIN (77777)</p>
            <input type="password" id="pin-input" class="pin-input" maxlength="5" placeholder="•••••" autofocus>
            <button class="lock-btn" id="unlock-btn">دخول</button>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <button class="new-chat-btn" id="new-chat-btn">+ محادثة جديدة</button>
            <div class="history-list" id="history-list"></div>
        </aside>

        <main class="main-content">
            <header>
                <div class="chat-title" id="current-chat-title">محادثة جديدة</div>
                <div class="header-actions">
                    <button class="icon-btn" id="open-rules-btn" title="قواعد النموذج">📌</button>
                    <button class="icon-btn" id="open-settings-btn" title="الإعدادات">⚙️</button>
                </div>
            </header>

            <div class="input-area">
                <button class="mic-btn" id="mic-btn" title="تحدث">🎤</button>
                <div class="input-box-wrapper">
                    <textarea id="user-input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                </div>
                <button class="send-btn" id="send-btn" title="إرسال">➤</button>
            </div>

            <div class="chat-box" id="chat-box"></div>
        </main>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3 style="margin-bottom: 1rem; color:var(--accent-blue);">إعدادات المفتاح (API Key)</h3>
            <input type="password" id="api-key-input" class="modal-input" placeholder="ألصق المفتاح هنا...">
            <button class="save-btn" id="save-settings-btn">حفظ الإعدادات</button>
        </div>
    </div>

    <div class="modal-overlay" id="rules-modal">
        <div class="modal">
            <h3 style="margin-bottom: 1rem; color:var(--accent-blue);">قواعد ومعلومات النموذج</h3>
            <textarea id="system-rules-input" class="modal-input" placeholder="اكتب التعليمات هنا..."></textarea>
            <button class="save-btn" id="save-rules-btn">حفظ القواعد</button>
        </div>
    </div>

    <script>
        const PIN_CODE = "77777";
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let systemRules = localStorage.getItem('gemini_system_rules') || 'أنت مساعد ذكي ومحرك قصص، ورد دائماً باللهجة المصرية العامية.';
        let modelName = 'gemini-1.5-flash'; // تم تثبيته على الموديل المدعوم رسمياً
        let chats = JSON.parse(localStorage.getItem('app_chats')) || [];
        let currentChatId = null;

        document.getElementById('unlock-btn').onclick = () => {
            if(document.getElementById('pin-input').value === PIN_CODE) {
                document.getElementById('lock-screen').classList.add('hidden');
                if(!apiKey) document.getElementById('settings-modal').classList.add('active');
                if(chats.length === 0) {
                    const newId = 'chat_' + Date.now();
                    chats.push({id: newId, title: 'محادثة جديدة', messages: []});
                    currentChatId = newId;
                } else {
                    currentChatId = chats[0].id;
                }
                renderHistory();
                loadChat();
            } else {
                alert('رمز PIN خطأ، الرمز هو 77777');
            }
        };

        document.getElementById('open-settings-btn').onclick = () => {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('settings-modal').classList.add('active');
        };

        document.getElementById('save-settings-btn').onclick = () => {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            document.getElementById('settings-modal').classList.remove('active');
            alert('تم حفظ المفتاح بنجاح!');
        };

        document.getElementById('open-rules-btn').onclick = () => {
            document.getElementById('system-rules-input').value = systemRules;
            document.getElementById('rules-modal').classList.add('active');
        };

        document.getElementById('save-rules-btn').onclick = () => {
            systemRules = document.getElementById('system-rules-input').value.trim();
            localStorage.setItem('gemini_system_rules', systemRules);
            document.getElementById('rules-modal').classList.remove('active');
            alert('تم حفظ القواعد بنجاح!');
        };

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.textContent = chat.title;
                div.onclick = () => {
                    currentChatId = chat.id;
                    loadChat();
                    renderHistory();
                };
                list.appendChild(div);
            });
        }

        function loadChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if(!chat) return;
            document.getElementById('current-chat-title').textContent = chat.title;
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            chat.messages.forEach((msg, index) => {
                box.innerHTML += `
                    <div class="message ${msg.role}">
                        <span>${msg.content}</span>
                        <button class="delete-msg-btn" onclick="window.deleteMessage(${index})" title="حذف الرسالة">🗑️</button>
                    </div>`;
            });
            box.scrollTop = 0;
        }

        window.deleteMessage = function(index) {
            const chat = chats.find(c => c.id === currentChatId);
            if(!chat) return;
            chat.messages.splice(index, 1);
            localStorage.setItem('app_chats', JSON.stringify(chats));
            loadChat();
        };

        document.getElementById('new-chat-btn').onclick = () => {
            const newId = 'chat_' + Date.now();
            chats.unshift({id: newId, title: 'محادثة جديدة', messages: []});
            currentChatId = newId;
            renderHistory();
            loadChat();
        };

        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('user-input').onkeypress = (e) => {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        async function sendMessage() {
            const text = document.getElementById('user-input').value.trim();
            if(!text) return;
            if(!apiKey) {
                alert('يرجى إدخال مفتاح API من الإعدادات أولاً.');
                document.getElementById('settings-modal').classList.add('active');
                return;
            }

            const chat = chats.find(c => c.id === currentChatId);
            if(!chat) return;

            if(chat.messages.length === 0) {
                chat.title = text.length > 15 ? text.substring(0, 15) + '...' : text;
                renderHistory();
            }

            chat.messages.push({role: 'user', content: text});
            localStorage.setItem('app_chats', JSON.stringify(chats));
            loadChat();
            document.getElementById('user-input').value = '';
            
            const box = document.getElementById('chat-box');
            const loadingId = 'load_' + Date.now();
            box.innerHTML += `<div class="message ai" id="${loadingId}"><span>جاري التفكير والكتابة...</span></div>`;
            box.scrollTop = 0;

            try {
                const requestBody = {
                    contents: [
                        {
                            parts: [
                                { text: systemRules + "\n\nسؤال المستخدم: " + text }
                            ]
                        }
                    ]
                };

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await res.json();
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();

                if(!res.ok || data.error) {
                    throw new Error(data.error?.message || `خطأ في الاتصال (كود: ${res.status})`);
                }

                const reply = data.candidates[0].content.parts[0].text;

                chat.messages.push({role: 'ai', content: reply});
                localStorage.setItem('app_chats', JSON.stringify(chats));
                loadChat();
            } catch(e) {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                
                box.innerHTML += `<div class="message error-msg"><span>❌ خطأ: ${e.message}</span></div>`;
                box.scrollTop = 0;
            }
        }
    </script>
</body>
</html>
