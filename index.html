<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة محمد التعليمية - LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- شريط التنقل العلوي -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">منصة محمد التعليمية 🎓</h1>
            <div id="user-info" class="text-sm">
                <!-- يتم تعبئته ديناميكياً -->
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        
        <!-- قسم تسجيل الدخول / تحديد الصلاحية للتجربة -->
        <section id="auth-section" class="bg-white p-6 rounded-xl shadow-sm mb-6 max-w-md mx-auto">
            <h2 class="text-lg font-bold mb-4 text-indigo-700">تسجيل الدخول / تحديد الهوية</h2>
            <div class="space-y-3">
                <input type="text" id="user-id-input" placeholder="أدخل معرف المستخدم (UID في Firebase)" class="w-full p-2 border rounded">
                <select id="user-role-select" class="w-full p-2 border rounded">
                    <option value="student">طالب</option>
                    <option value="teacher">معلم</option>
                    <option value="admin">الإدارة العامة (أدمن)</option>
                </select>
                <button onclick="loginUser()" class="w-full bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700">دخول</button>
            </div>
        </section>

        <!-- لوحة التحكم والعمليات -->
        <div id="dashboard" class="hidden space-y-8">
            
            <!-- قسم الإدارة العامة (شحن المحفظة) -->
            <div id="admin-panel" class="hidden bg-amber-50 border border-amber-200 p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-bold text-amber-800 mb-3">لوحة الإدارة العامة (شحن المحفظة)</h3>
                <p class="text-sm text-amber-600 mb-3">ملاحظة: كل 1 جنيه = 1 نقطة.</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="target-student-id" placeholder="معرف الطالب (UID)" class="p-2 border rounded">
                    <input type="number" id="recharge-amount" placeholder="المبلغ بالجنيه (النقاط)" class="p-2 border rounded">
                    <button onclick="handleRecharge()" class="bg-amber-600 text-white p-2 rounded hover:bg-amber-700">شحن المحفظة</button>
                </div>
            </div>

            <!-- قسم المعلم (إضافة كورس وامتحانات) -->
            <div id="teacher-panel" class="hidden bg-blue-50 border border-blue-200 p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-bold text-blue-800 mb-3">لوحة المعلم (إضافة كورسات وامتحانات)</h3>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="course-title" placeholder="عنوان الكورس" class="p-2 border rounded">
                        <input type="number" id="course-price" placeholder="سعر الكورس بالنقاط" class="p-2 border rounded">
                    </div>
                    <textarea id="course-video-url" placeholder="روابط الفيديوهات (رابط واحد لكل سطر)" class="w-full p-2 border rounded"></textarea>
                    <button onclick="handleCreateCourse()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">إضافة الكورس</button>
                </div>
            </div>

            <!-- قسم استعراض الكورسات المتاحة -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-bold mb-4 text-indigo-700">الكورسات المتاحة</h3>
                <div id="courses-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- يتم جلب الكورسات هنا -->
                </div>
            </div>

        </div>

    </main>

    <!-- سكربت Firebase والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, update, remove, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            databaseURL: "https://mr-mohammed-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = null;

        window.loginUser = async function() {
            const uid = document.getElementById('user-id-input').value.trim();
            const role = document.getElementById('user-role-select').value;
            
            if(!uid) {
                alert("الرجاء إدخال معرف المستخدم!");
                return;
            }

            currentUser = { uid, role };
            
            // حفظ أو تحديث بيانات المستخدم في القاعدة
            await update(ref(db, `users/${uid}`), { role, uid });

            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            // إظهار اللوحات حسب الصلاحية
            if(role === 'admin') document.getElementById('admin-panel').classList.remove('hidden');
            if(role === 'teacher') document.getElementById('teacher-panel').classList.remove('hidden');

            loadUserData();
            loadCourses();
        }

        function loadUserData() {
            const userRef = ref(db, `users/${currentUser.uid}`);
            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                const wallet = data && data.wallet ? data.wallet : 0;
                document.getElementById('user-info').innerHTML = `المستخدم: ${currentUser.uid} | الصلاحية: <b>${currentUser.role}</b> | المحفظة: <span class="bg-green-500 px-2 py-1 rounded text-white">${wallet} نقطة</span>`;
            });
        }

        // 1. الإدارة العامة: شحن النقاط (كل 1 جنيه = 1 نقطة)
        window.handleRecharge = async function() {
            const targetId = document.getElementById('target-student-id').value.trim();
            const amount = Number(document.getElementById('recharge-amount').value);

            if(!targetId || !amount) {
                alert("الرجاء إدخال البيانات صحيحة");
                return;
            }

            const studentWalletRef = ref(db, `users/${targetId}/wallet`);
            const snap = await get(studentWalletRef);
            const currentWallet = snap.exists() ? snap.val() : 0;

            await update(ref(db, `users/${targetId}`), { wallet: currentWallet + amount });
            alert(`تم شحن ${amount} نقطة بنجاح للطالب!`);
        }

        // 2. المعلم: إضافة كورس
        window.handleCreateCourse = async function() {
            const title = document.getElementById('course-title').value;
            const price = Number(document.getElementById('course-price').value);
            const videoUrl = document.getElementById('course-video-url').value;

            if(!title || !price) {
                alert("الرجاء إدخال العنوان والسعر");
                return;
            }

            const newCourseRef = push(ref(db, 'courses'));
            await set(newCourseRef, {
                title,
                price,
                teacherId: currentUser.uid,
                videoUrl,
                createdAt: Date.now()
            });

            alert("تم إضافة الكورس بنجاح!");
        }

        // 3. عرض الكورسات وشراؤها
        function loadCourses() {
            const coursesRef = ref(db, 'courses');
            onValue(coursesRef, (snapshot) => {
                const listDiv = document.getElementById('courses-list');
                listDiv.innerHTML = '';
                
                const courses = snapshot.val();
                if(!courses) {
                    listDiv.innerHTML = '<p class="text-slate-500">لا توجد كورسات مضافة حالياً.</p>';
                    return;
                }

                Object.keys(courses).forEach(courseId => {
                    const course = courses[courseId];
                    listDiv.innerHTML += `
                        <div class="bg-slate-50 border p-4 rounded-lg shadow-sm flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-lg text-indigo-900">${course.title}</h4>
                                <p class="text-sm text-slate-600 mt-1">السعر: ${course.price} نقطة (جنيه)</p>
                            </div>
                            <button onclick="buyCourse('${courseId}', ${course.price})" class="mt-4 bg-green-600 text-white py-2 rounded hover:bg-green-700">شراء الكورس</button>
                        </div>
                    `;
                });
            });
        }

        // 4. شراء الكورس بالنقاط من محفظة الطالب
        window.buyCourse = async function(courseId, price) {
            const studentRef = ref(db, `users/${currentUser.uid}`);
            const snap = await get(studentRef);
            const userData = snap.val();
            const currentWallet = userData && userData.wallet ? userData.wallet : 0;

            if(currentWallet < price) {
                alert("رصيد محفظتك غير كافٍ لشراء الكورس! اطلب من الإدارة العامة شحن المحفظة.");
                return;
            }

            // خصم النقاط
            await update(studentRef, { wallet: currentWallet - price });
            
            // تسجيل عملية الشراء
            await set(ref(db, `purchases/${currentUser.uid}_${courseId}`), {
                studentId: currentUser.uid,
                courseId,
                timestamp: Date.now()
            });

            alert("تم شراء الكورس بنجاح ومبروك عليك المحتوى!");
        }
    </script>
</body>
</html>
