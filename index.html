<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الامتحانات والتقييم الذكي</title>
    <!-- مكتبات Firebase المباشرة عبر CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --primary-color: #1a73e8;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #202124;
            --border-color: #dadce0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .status-online { background-color: #e6f4ea; color: #137333; }
        .status-offline { background-color: #fce8e6; color: #c5221f; }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1557b0;
        }

        .question-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
        }

        .option-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .option-item input {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="connection-status" class="status-badge status-offline">جاري الاتصال بالسحابة...</div>

    <!-- قسم المعلم: إدخال ونشر الامتحان -->
    <div id="teacher-section">
        <h1>لوحة المعلم - نشر امتحان جديد 🚀</h1>
        <form id="quiz-form">
            <div class="form-group">
                <label for="quiz-title">عنوان الامتحان / الدرس:</label>
                <input type="text" id="quiz-title" placeholder="أدخل عنوان الامتحان..." required>
            </div>

            <div class="form-group">
                <label for="question-text">السؤال:</label>
                <textarea id="question-text" rows="3" placeholder="اكتب السؤال هنا..." required></textarea>
            </div>

            <div class="form-group">
                <label>الخيارات:</label>
                <input type="text" class="option-input" placeholder="الخيار الأول" style="margin-bottom:5px;" required>
                <input type="text" class="option-input" placeholder="الخيار الثاني" style="margin-bottom:5px;" required>
                <input type="text" class="option-input" placeholder="الخيار الثالث" style="margin-bottom:5px;" required>
                <input type="text" class="option-input" placeholder="الخيار الرابع" style="margin-bottom:5px;" required>
            </div>

            <div class="form-group">
                <label for="correct-option">رقم الخيار الصحيح (1-4):</label>
                <select id="correct-option" required>
                    <option value="0">الخيار الأول</option>
                    <option value="1">الخيار الثاني</option>
                    <option value="2">الخيار الثالث</option>
                    <option value="3">الخيار الرابع</option>
                </select>
            </div>

            <button type="submit" id="publish-btn">حفظ ونشر لكل الطلاب 🚀</button>
        </form>
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #dadce0;">

    <!-- قسم الطالب: عرض الامتحان المباشر -->
    <div id="student-section">
        <h2>الامتحان الحالي المباشر 📖</h2>
        <div id="quiz-display">
            <p style="text-align:center; color:#666;">لا يوجد امتحان منشور حالياً...</p>
        </div>
    </div>
</div>

<script>
    // 1. تهيئة Firebase باستخدام رابط المحرك السحابي الخاص بك
    const firebaseConfig = {
        databaseURL: "https://mr-mohammed-default-rtdb.firebaseio.com"
    };

    // بدء اتصال Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const statusBadge = document.getElementById('connection-status');
    const quizForm = document.getElementById('quiz-form');
    const quizDisplay = document.getElementById('quiz-display');

    // 2. مراقبة حالة الاتصال بالخادم
    database.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
            statusBadge.textContent = "متصل بالسحابة (مباشر) 🟢";
            statusBadge.className = "status-badge status-online";
        } else {
            statusBadge.textContent = "غير متصل بالسحابة 🔴";
            statusBadge.className = "status-badge status-offline";
        }
    });

    // 3. نشر الامتحان عند ضغط المعلم على الزر
    quizForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const title = document.getElementById('quiz-title').value;
        const question = document.getElementById('question-text').value;
        const optionsInputs = document.querySelectorAll('.option-input');
        const correctIndex = parseInt(document.getElementById('correct-option').value);

        const options = Array.from(optionsInputs).map(input => input.value);

        const quizData = {
            title: title,
            question: question,
            options: options,
            correctOption: correctIndex,
            timestamp: Date.now()
        };

        // حفظ البيانات في المسار 'current_quiz' على Firebase
        database.ref('current_quiz').set(quizData)
            .then(() => {
                alert('تم نشر الامتحان بنجاح لجميع الطلاب!');
                quizForm.reset();
            })
            .catch((error) => {
                alert('حدث خطأ أثناء النشر: ' + error.message);
            });
    });

    // 4. الاستماع اللحظي للطلاب والتحديث الفوري بدون إعادة تحميل
    database.ref('current_quiz').on('value', (snapshot) => {
        const data = snapshot.val();

        if (!data) {
            quizDisplay.innerHTML = '<p style="text-align:center; color:#666;">لا يوجد امتحان منشور حالياً...</p>';
            return;
        }

        let optionsHTML = '';
        data.options.forEach((opt, index) => {
            optionsHTML += `
                <div class="option-item">
                    <input type="radio" name="student-answer" id="opt-${index}" value="${index}">
                    <label for="opt-${index}" style="font-weight:normal; margin:0;">${opt}</label>
                </div>
            `;
        });

        quizDisplay.innerHTML = `
            <div class="question-card">
                <h3>${data.title}</h3>
                <p><strong>السؤال:</strong> ${data.question}</p>
                <div style="margin-top:15px;">${optionsHTML}</div>
                <button onclick="submitAnswer(${data.correctOption})" style="margin-top:15px; background-color:#34a853;">إرسال الإجابة</button>
            </div>
        `;
    });

    // 5. التحقق من إجابة الطالب
    window.submitAnswer = function(correctOption) {
        const selected = document.querySelector('input[name="student-answer"]:checked');
        if (!selected) {
            alert('يرجى اختيار إجابة أولاً!');
            return;
        }

        if (parseInt(selected.value) === correctOption) {
            alert('إجابة صحيحة! أحسنت 🥳');
        } else {
            alert('إجابة خاطئة، حاول مرة أخرى! ❌');
        }
    };
</script>

</body>
</html>
