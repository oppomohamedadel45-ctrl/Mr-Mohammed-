<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة آمنة - إدخال سري محمي</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none; /* منع تحديد النصوص */
            -webkit-user-select: none;
        }
        .secure-container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #38bdf8;
        }
        .display-box {
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: #a855f7;
            margin-bottom: 20px;
            min-height: 30px;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .key {
            background: #334155;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .key:hover {
            background: #475569;
        }
        .key:active {
            background: #64748b;
        }
        .warning-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #ef4444;
            display: none;
        }
    </style>
</head>
<body>

<div class="secure-container">
    <h2>منطقة آمنة - إدخال سري</h2>
    <div id="display" class="display-box"></div>
    
    <div class="keypad">
        <button class="key" onclick="appendKey('1')">1</button>
        <button class="key" onclick="appendKey('2')">2</button>
        <button class="key" onclick="appendKey('3')">3</button>
        <button class="key" onclick="appendKey('4')">4</button>
        <button class="key" onclick="appendKey('5')">5</button>
        <button class="key" onclick="appendKey('6')">6</button>
        <button class="key" onclick="appendKey('7')">7</button>
        <button class="key" onclick="appendKey('8')">8</button>
        <button class="key" onclick="appendKey('9')">9</button>
        <button class="key" onclick="clearInput()">مسح</button>
        <button class="key" onclick="appendKey('0')">0</button>
        <button class="key" onclick="submitCode()">تأكيد</button>
    </div>

    <div id="warning" class="warning-msg">⚠️ ممنوع أخذ لقطة شاشة أو استخدام الكيبورد الخارجي!</div>
</div>

<script>
    let secretCode = "";
    const display = document.getElementById("display");
    const warning = document.getElementById("warning");

    // إضافة الرقم عبر لوحة المفاتيح الافتراضية وإخفاؤه بنقاط (•)
    function appendKey(num) {
        if (secretCode.length < 8) {
            secretCode += num;
            display.innerText = "•".repeat(secretCode.length);
        }
    }

    function clearInput() {
        secretCode = "";
        display.innerText = "";
    }

    function submitCode() {
        if(secretCode.length === 0) {
            alert("الرجاء إدخال الكود أولاً");
            return;
        }
        alert("تم إرسال الكود والتحقق منه بأمان تام.");
        clearInput();
    }

    // 1. منع استخدام الكيبورد الخارجي تماماً لمنع ظهور الحروف/الأرقام منه
    window.addEventListener('keydown', function(e) {
        // السماح فقط بمفاتيح التحكم الضرورية إذا لزم، أو منع الكل تماماً لقص أمان الكيبورد
        e.preventDefault();
        warning.style.display = "block";
        setTimeout(() => { warning.style.display = "none"; }, 3000);
    });

    // 2. منع النقر بزر المظهر الأيمن لمنع فحص العناصر أو الحفظ
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // 3. محاولة رصد وضبابية الصفحة عند محاولة أخذ لقطة شاشة (PrintScreen أو التبديل)
    document.addEventListener('keyup', function (e) {
        if (e.key == 'PrintScreen') {
            navigator.clipboard.writeText(''); // تفريغ الحافظة
            alert('لقطات الشاشة محظورة تماماً داخل هذه المنصة لأسباب أمنية!');
            document.body.style.filter = 'blur(20px)';
            setTimeout(() => { document.body.style.filter = 'none'; }, 2000);
        }
    });

    // إخفاء المحتوى عند خروج الفأرة أو التركيز عن النافذة
    window.addEventListener('blur', function() {
        document.body.style.filter = 'blur(15px)';
    });
    window.addEventListener('focus', function() {
        document.body.style.filter = 'none';
    });
</script>

</body>
</html>
